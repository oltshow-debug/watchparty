<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RACE CANADA EP 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    header p  { color: #8b949e; }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .video-card {
      background: #161b22;
      border: 1px solid #58a6ff;
      border-radius: 12px;
      overflow: hidden;
    }

    /* Responsive 16:9 iframe wrapper */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-info { padding: 1rem 1.25rem; }
    .video-info h2 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    .video-info p  { font-size: 0.9rem; color: #8b949e; }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: #1f6feb;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      color: #8b949e;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎬 RACE CANADA EP 1</h1>
    <p>Featured video</p>
  </header>

  <main class="video-grid">

    <!-- RACE CANADA EP 1 — MixDrop embed -->
    <article class="video-card">
      <div class="video-wrapper">
        <iframe
          src="https://mixdrop.top/e/k0wj9prnc6jr6k"
          title="RACE CANADA EP 1"
          allowfullscreen
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          referrerpolicy="no-referrer-when-downgrade"
          loading="lazy">
        </iframe>
      </div>
      <div class="video-info">
        <span class="badge">Episode 1</span>
        <h2>RACE CANADA EP 1</h2>
        <p>Embedded from mixdrop.top</p>
      </div>
    </article>

  </main>

  <footer>
    <p>Built with GitHub Pages ❤️</p>
  </footer>
</body>
</html>
